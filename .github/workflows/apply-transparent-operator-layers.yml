name: Apply transparent operator layers

on:
  push:
    branches: [ux/transparent-panels-solo-identities]
    paths:
      - '.github/workflows/apply-transparent-operator-layers.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Apply transparent panels, strong solo and identity labels
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected 1 occurrence, found {count}")
              return text.replace(old, new, 1)

          def replace_block(text, start_marker, end_marker, replacement, label):
              start = text.find(start_marker)
              if start < 0:
                  raise RuntimeError(f"{label}: start marker not found")
              end = text.find(end_marker, start + len(start_marker))
              if end < 0:
                  raise RuntimeError(f"{label}: end marker not found")
              return text[:start] + replacement + text[end:]

          Path("src/operator-visual-state.js").write_text("""export function deriveOperatorVisualState(slots = []) {
            const slotByCluster = new Map();
            const soloSlotIds = new Set();
            const soloClusterKeys = new Set();

            for (const slot of slots) {
              if (!slot) continue;
              if (slot.clusterKey) slotByCluster.set(slot.clusterKey, slot);
              if (!slot.enabled || !slot.solo) continue;
              soloSlotIds.add(slot.id);
              if (slot.clusterKey) soloClusterKeys.add(slot.clusterKey);
            }

            return {
              slotByCluster,
              soloSlotIds,
              soloClusterKeys,
              soloMode: soloSlotIds.size > 0
            };
          }

          export function identityNameForCluster(slot, clusterKey) {
            if (!slot || !clusterKey || slot.identityKey !== clusterKey) return '';
            return String(slot.identityName ?? '').trim();
          }

          export function operatorLabelForCluster(slot, clusterKey) {
            if (!slot) return '';
            const identityName = identityNameForCluster(slot, clusterKey);
            return identityName
              ? `${identityName}\nID ${slot.id}`
              : `ID ${slot.id}`;
          }
          """)

          Path("tests/operator-visual-state.test.mjs").write_text("""import assert from 'node:assert/strict';
          import test from 'node:test';
          import {
            deriveOperatorVisualState,
            identityNameForCluster,
            operatorLabelForCluster
          } from '../src/operator-visual-state.js';

          test('solo mode keeps every enabled solo slot as a focus target', () => {
            const state = deriveOperatorVisualState([
              { id: 1, enabled: true, solo: true, clusterKey: 'alice' },
              { id: 2, enabled: true, solo: false, clusterKey: 'bob' },
              { id: 3, enabled: true, solo: true, clusterKey: 'carol' }
            ]);

            assert.equal(state.soloMode, true);
            assert.deepEqual([...state.soloSlotIds], [1, 3]);
            assert.deepEqual([...state.soloClusterKeys], ['alice', 'carol']);
          });

          test('an enabled manual solo slot without a cluster still activates solo mode', () => {
            const state = deriveOperatorVisualState([
              { id: 1, enabled: true, solo: true, clusterKey: null }
            ]);

            assert.equal(state.soloMode, true);
            assert.equal(state.soloClusterKeys.size, 0);
          });

          test('disabled solo slots do not activate solo mode', () => {
            const state = deriveOperatorVisualState([
              { id: 1, enabled: false, solo: true, clusterKey: 'alice' }
            ]);

            assert.equal(state.soloMode, false);
          });

          test('identity names do not follow a temporary operator override', () => {
            const slot = {
              id: 1,
              clusterKey: 'bob',
              identityKey: 'alice',
              identityName: 'Alice'
            };

            assert.equal(identityNameForCluster(slot, 'bob'), '');
            assert.equal(operatorLabelForCluster(slot, 'bob'), 'ID 1');
            assert.equal(identityNameForCluster(slot, 'alice'), 'Alice');
          });

          test('matching identities render above their public ID', () => {
            const slot = {
              id: 4,
              clusterKey: 'singer-a',
              identityKey: 'singer-a',
              identityName: 'Singer A'
            };

            assert.equal(operatorLabelForCluster(slot, 'singer-a'), 'Singer A\nID 4');
          });
          """)

          path = Path("src/viewer.js")
          text = path.read_text()
          text = replace_once(
              text,
              "import { GHOST_CLUSTER_COLOR, clusterColorValue } from './cluster-color.js';\n",
              "import { GHOST_CLUSTER_COLOR, clusterColorValue } from './cluster-color.js';\n"
              "import { deriveOperatorVisualState, operatorLabelForCluster } from './operator-visual-state.js';\n",
              "viewer operator visual import",
          )
          text = replace_once(
              text,
              "const LOOK_AT_MARKER_GHOST_OPACITY = 0.24;\n",
              "const LOOK_AT_MARKER_GHOST_OPACITY = 0.24;\n"
              "const SOLO_DIMMED_BOX_OPACITY = 0.035;\n"
              "const SOLO_DIMMED_POINT_OPACITY = 0.02;\n"
              "const SOLO_DIMMED_LABEL_OPACITY = 0.025;\n"
              "const SOLO_DIMMED_VECTOR_OPACITY = 0.025;\n"
              "const SOLO_DIMMED_CENTROID_OPACITY = 0.035;\n",
              "solo opacity constants",
          )
          text = replace_once(
              text,
              "  let selectedClusterKey = null;\n"
              "  let dropClusterKey = null;\n",
              "  let selectedClusterKey = null;\n"
              "  let dropClusterKey = null;\n"
              "  let soloMode = false;\n"
              "  let soloSlotIds = new Set();\n"
              "  let soloClusterKeys = new Set();\n",
              "viewer solo state",
          )
          text = replace_once(
              text,
              "      new THREE.MeshBasicMaterial({ color })\n",
              "      new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1 })\n",
              "centroid transparency",
          )
          text = replace_once(
              text,
              "      operatorStateReady: false,\n"
              "      operatorId: null,\n"
              "      clusterState: null,\n",
              "      operatorStateReady: false,\n"
              "      operatorId: null,\n"
              "      operatorLabelText: '',\n"
              "      clusterState: null,\n",
              "operator label state",
          )

          text = replace_block(
              text,
              "  function updateLabel(view, id, uuid) {",
              "  function updateCluster(view, cluster) {",
              """  function updateLabel(view, id, uuid) {
            view.sourceId = id;
            view.uuid = uuid || '';
            const labelText = view.operatorStateReady
              ? view.operatorLabelText
              : id !== undefined ? String(id) : uuid ? uuid.slice(0, 8) : '';
            if (!labelText) {
              view.label.visible = false;
              return;
            }

            if (view.labelText !== labelText) {
              replaceLabelTexture(view.label, labelText, view.color);
              view.labelText = labelText;
            }
            view.label.visible = true;
          }

          """,
              "identity-aware updateLabel",
          )

          text = replace_once(
              text,
              "    view.label.material.opacity = state === ClusterState.Ghost ? 0.55 : 1;\n",
              "",
              "label opacity owned by interaction style",
          )

          text = replace_block(
              text,
              "  function applyInteractionStyle(view) {",
              "  function refreshInteractionStyles() {",
              """  function applyInteractionStyle(view) {
            if (view.clusterState === null) return;
            const selected = view.key === selectedClusterKey;
            const dropTarget = view.key === dropClusterKey;
            const soloDimmed = soloMode && !soloClusterKeys.has(view.key) && !dropTarget;
            const baseColor = view.clusterState === ClusterState.Ghost ? GHOST_COLOR : view.color;
            const color = dropTarget ? DROP_TARGET_COLOR : baseColor;

            view.box.material.color.copy(color);
            view.lookAtMarker.material.color.copy(color);
            view.centroid.material.color.copy(color);
            view.velocity.setColor(color);
            view.points.material.color.copy(color);

            view.box.material.opacity = soloDimmed
              ? SOLO_DIMMED_BOX_OPACITY
              : dropTarget || selected
                ? 1
                : view.clusterState === ClusterState.WillLeave ? 0.35 : 0.95;
            view.lookAtMarker.material.opacity = soloDimmed
              ? SOLO_DIMMED_VECTOR_OPACITY
              : view.clusterState === ClusterState.Ghost
                ? LOOK_AT_MARKER_GHOST_OPACITY
                : view.clusterState === ClusterState.WillLeave
                  ? LOOK_AT_MARKER_OPACITY * 0.55
                  : LOOK_AT_MARKER_OPACITY;
            view.points.material.opacity = soloDimmed
              ? SOLO_DIMMED_POINT_OPACITY
              : dropTarget || selected
                ? 1
                : view.clusterState === ClusterState.Ghost ? 0.45 : 0.92;
            view.centroid.material.opacity = soloDimmed ? SOLO_DIMMED_CENTROID_OPACITY : 1;
            view.label.material.opacity = soloDimmed
              ? SOLO_DIMMED_LABEL_OPACITY
              : view.clusterState === ClusterState.Ghost ? 0.55 : 1;
            setArrowOpacity(view.velocity, soloDimmed ? SOLO_DIMMED_VECTOR_OPACITY : 0.95);
            view.centroid.scale.setScalar(dropTarget ? 1.8 : selected ? 1.45 : 1);
          }

          """,
              "viewer solo dim style",
          )

          text = replace_block(
              text,
              "  function setOperatorState(snapshot) {",
              "  function syncManualViews(slots, clusters) {",
              """  function setOperatorState(snapshot) {
            const slots = snapshot?.slots ?? [];
            const clusters = snapshot?.clusters ?? [];
            const selected = snapshot?.selected ?? null;
            const operatorVisualState = deriveOperatorVisualState(slots);
            const slotByCluster = operatorVisualState.slotByCluster;
            soloMode = operatorVisualState.soloMode;
            soloSlotIds = operatorVisualState.soloSlotIds;
            soloClusterKeys = operatorVisualState.soloClusterKeys;

            selectedClusterKey = selected?.type === 'cluster'
              ? selected.key
              : selected?.type === 'id'
                ? slots.find((slot) => slot.id === selected.id)?.clusterKey ?? null
                : null;

            for (const view of views.values()) {
              const slot = slotByCluster.get(view.key);
              view.operatorStateReady = true;
              view.operatorId = slot?.id ?? null;
              view.operatorLabelText = operatorLabelForCluster(slot, view.key);
              updateLabel(view, view.sourceId, view.uuid);
            }

            syncManualViews(slots, clusters);
            refreshInteractionStyles();
          }

          """,
              "viewer operator state",
          )

          sync_start = text.index("  function syncManualViews(slots, clusters) {")
          sync_end = text.index("  function createManualView(id) {", sync_start)
          sync_block = text[sync_start:sync_end]
          sync_block = replace_once(
              sync_block,
              "      updateManualLink(view);\n",
              "      applyManualSoloStyle(view, soloMode && !soloSlotIds.has(slot.id));\n"
              "      updateManualLink(view);\n",
              "manual solo style call",
          )
          text = text[:sync_start] + sync_block + text[sync_end:]

          text = replace_once(
              text,
              "  function updateManualLink(view) {\n",
              """  function applyManualSoloStyle(view, dimmed) {
            view.box.material.opacity = dimmed ? SOLO_DIMMED_BOX_OPACITY : 0.92;
            view.centroid.material.opacity = dimmed ? SOLO_DIMMED_CENTROID_OPACITY : 0.95;
            view.link.material.opacity = dimmed ? SOLO_DIMMED_VECTOR_OPACITY : 0.42;
            view.label.material.opacity = dimmed ? SOLO_DIMMED_LABEL_OPACITY : 1;
          }

            function updateManualLink(view) {
          """,
              "manual solo helper",
          )

          text = replace_once(
              text,
              "function updateVelocity(arrow, origin, velocity, color, direction) {\n",
              """function setArrowOpacity(arrow, opacity) {
            arrow.line.material.opacity = opacity;
            arrow.cone.material.opacity = opacity;
          }

          function updateVelocity(arrow, origin, velocity, color, direction) {
          """,
              "arrow opacity helper",
          )

          text = replace_block(
              text,
              "function createLabelSprite(text, color) {",
              "function roundedRect(ctx, x, y, width, height, radius) {",
              """function createLabelSprite(text, color) {
            const material = new THREE.SpriteMaterial({
              map: makeLabelTexture(text, color),
              transparent: true,
              depthTest: false,
              depthWrite: false
            });
            const sprite = new THREE.Sprite(material);
            updateLabelScale(sprite, text);
            sprite.renderOrder = 10;
            return sprite;
          }

          function replaceLabelTexture(sprite, text, color) {
            sprite.material.map?.dispose();
            sprite.material.map = makeLabelTexture(text, color);
            sprite.material.needsUpdate = true;
            updateLabelScale(sprite, text);
          }

          function updateLabelScale(sprite, text) {
            sprite.scale.set(1.0, String(text).includes('\n') ? 0.36 : 0.31, 1);
          }

          function makeLabelTexture(text, color) {
            const canvas = document.createElement('canvas');
            canvas.width = 384;
            canvas.height = 128;

            const ctx = canvas.getContext('2d');
            if (!ctx) return new THREE.CanvasTexture(canvas);

            const cssColor = `#${color.getHexString()}`;
            const lines = String(text ?? '').split('\n', 2);

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            roundedRect(ctx, 20, 14, 344, 100, 24);
            ctx.fillStyle = 'rgba(10, 13, 18, 0.88)';
            ctx.fill();

            ctx.strokeStyle = cssColor;
            ctx.lineWidth = 5;
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            if (lines.length > 1) {
              ctx.font = '600 40px Inter, Arial, sans-serif';
              ctx.fillText(lines[0], 192, 46, 320);
              ctx.fillStyle = 'rgba(255, 255, 255, 0.74)';
              ctx.font = '500 24px Inter, Arial, sans-serif';
              ctx.fillText(lines[1], 192, 86, 320);
            } else {
              ctx.font = '500 42px Inter, Arial, sans-serif';
              ctx.fillText(lines[0], 192, 65, 320);
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            texture.minFilter = THREE.LinearFilter;
            texture.magFilter = THREE.LinearFilter;
            texture.generateMipmaps = false;
            return texture;
          }

          """,
              "multiline identity labels",
          )
          path.write_text(text)

          path = Path("src/id-interface.js")
          text = path.read_text()
          text = replace_once(
              text,
              "import { clusterDisplayColorCss } from './cluster-color.js';\n",
              "import { clusterDisplayColorCss } from './cluster-color.js';\n"
              "import { deriveOperatorVisualState } from './operator-visual-state.js';\n",
              "interface operator visual import",
          )
          text = replace_once(
              text,
              "    const soloMode = snapshot.slots.some((slot) => slot.enabled && slot.solo);\n"
              "    idList.classList.toggle('solo-mode', soloMode);\n",
              "    const operatorVisualState = deriveOperatorVisualState(snapshot.slots);\n"
              "    const soloMode = operatorVisualState.soloMode;\n"
              "    idList.classList.toggle('solo-mode', soloMode);\n"
              "    clusterTray.classList.toggle('solo-mode', soloMode);\n",
              "interface solo state",
          )
          chip_marker = """        chip.style.setProperty(
            '--cluster-color',
            clusterDisplayColorCss(cluster.key, cluster.sourceId, cluster.ghost)
          );
          """
          chip_replacement = chip_marker + """        const isSolo = operatorVisualState.soloClusterKeys.has(cluster.key);
            chip.classList.toggle('is-solo', isSolo);
            chip.classList.toggle('is-solo-muted', soloMode && !isSolo);
          """
          text = replace_once(text, chip_marker, chip_replacement, "cluster tray solo classes")
          path.write_text(text)

          path = Path("src/styles.css")
          text = path.read_text()
          marker = "/* Transparent operator layers v0.4 */"
          if marker in text:
              raise RuntimeError("transparent operator layer CSS already present")
          text += r'''

          /* Transparent operator layers v0.4 */
          .workspace {
            position: relative;
            display: block;
            padding: 8px;
          }
          .stage {
            position: absolute;
            z-index: 0;
            inset: 8px;
          }
          .id-panel {
            position: absolute;
            z-index: 12;
            top: 12px;
            bottom: 12px;
            left: 12px;
            width: var(--left-width);
            border-color: transparent;
            background: transparent;
            box-shadow: none;
          }
          .id-panel .panel-header,
          .id-panel .panel-help,
          .id-list {
            background: transparent;
          }
          .id-panel .panel-header,
          .id-panel .panel-help {
            text-shadow: 0 1px 8px rgba(0,0,0,.88);
          }
          .inspector-panel {
            position: absolute;
            z-index: 12;
            top: 12px;
            right: 12px;
            bottom: 12px;
            width: var(--right-width);
            border-color: rgba(255,255,255,.055);
            background: rgba(24,24,24,.58);
            box-shadow: 0 8px 22px rgba(0,0,0,.16);
            backdrop-filter: blur(10px);
          }
          .inspector-panel .inspector-heading,
          .inspector-panel .inspector-section {
            background: transparent;
          }

          .cluster-dock {
            padding: 0;
            border: 0;
            border-radius: 0;
            background: transparent;
            box-shadow: none;
            backdrop-filter: none;
          }

          .id-row {
            background: rgba(18,18,18,.035);
          }
          .id-row.is-empty {
            background: rgba(18,18,18,.035);
          }
          .id-row.is-filled {
            border-color: color-mix(in srgb, var(--cluster-color) 72%, var(--line));
            background: linear-gradient(
              90deg,
              color-mix(in srgb, var(--cluster-color) 18%, transparent),
              color-mix(in srgb, var(--cluster-color) 4%, transparent)
            );
          }
          .id-row.is-disabled {
            background: rgba(18,18,18,.025);
            border-style: dashed;
          }
          .id-row.is-empty.is-locked {
            background: rgba(18,18,18,.035);
          }
          .id-list.solo-mode .id-row.is-solo-muted {
            opacity: .08;
            filter: saturate(.12) brightness(.58);
          }

          .cluster-chip {
            border-color: color-mix(in srgb, var(--cluster-color) 48%, var(--line-soft));
            background: transparent;
          }
          .cluster-chip:hover {
            background: color-mix(in srgb, var(--cluster-color) 8%, transparent);
          }
          .cluster-chip.selected {
            background: color-mix(in srgb, var(--cluster-color) 12%, transparent);
          }
          .cluster-tray.solo-mode .cluster-chip.is-solo-muted {
            opacity: .07;
            filter: saturate(.08) brightness(.48);
          }
          .cluster-tray.solo-mode .cluster-chip.is-solo {
            opacity: 1;
          }

          @media (max-width: 820px), (pointer: coarse) and (max-width: 980px) {
            .stage { inset: 6px; }
            .id-panel,
            .inspector-panel {
              top: auto;
              width: auto;
            }
            .id-panel {
              background: rgba(18,18,18,.16);
              backdrop-filter: blur(4px);
            }
            .inspector-panel {
              background: rgba(24,24,24,.70);
              backdrop-filter: blur(11px);
            }
          }
          '''
          path.write_text(text)

          path = Path("src/app-info.js")
          text = path.read_text()
          text = replace_once(text, "0.3.0-proto", "0.4.0-proto", "version bump")
          path.write_text(text)

          path = Path("README.md")
          text = path.read_text()
          marker = "- Selection uses a neutral white outline instead of replacing the cluster color. Solo dims non-solo slots, while Manual and Override remain explicit secondary badges.\n"
          addition = (
              marker
              + "- Desktop operator controls float over the live 3D view: the ID list and live-cluster tray have transparent surfaces, while the inspector keeps only a light alpha/blur layer for control readability.\n"
              + "- Solo is a true spatial focus mode: with one or more enabled solo slots, every non-solo tracked cluster is reduced to only a few percent opacity in 3D; multiple solo targets stay fully visible together.\n"
              + "- A learned identity name is drawn above its matching cluster in 3D with the public ID underneath. Identity names never follow a temporary operator override.\n"
          )
          text = replace_once(text, marker, addition, "README new visual behaviors")
          path.write_text(text)

          path = Path("AGENTS.md")
          text = path.read_text()
          marker = "- Cluster colors must come from `src/cluster-color.js`; never duplicate the palette or color-selection rule in the viewer or operator UI.\n"
          addition = (
              marker
              + "- Solo is a renderer-level focus state, not only an ID-list style. When enabled solo slots exist, non-solo clusters, labels, point clouds, centroids, velocity vectors and manual proxies must all be strongly dimmed while every solo target stays fully legible.\n"
              + "- A 3D identity label is valid only when the slot's `identityKey` matches the displayed cluster key. Never display the reserved identity name on a temporary override cluster.\n"
              + "- Keep the ID list and live-cluster tray transparent over the 3D stage; do not reintroduce opaque panel/card backgrounds unless explicitly requested.\n"
          )
          text = replace_once(text, marker, addition, "AGENTS solo identity invariants")
          path.write_text(text)
          PY

          git diff --check
          rm .github/workflows/apply-transparent-operator-layers.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Float operator layers over the 3D scene"
          git push
