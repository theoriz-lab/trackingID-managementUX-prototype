name: Apply transparent operator layers

on:
  push:
    branches: [ux/transparent-panels-solo-identities]
    paths:
      - '.github/workflows/apply-transparent-operator-layers.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Apply transparent panels, strong solo and identity labels
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected 1 occurrence, found {count}")
              return text.replace(old, new, 1)

          Path("src/operator-visual-state.js").write_text("""export function deriveOperatorVisualState(slots = []) {
            const slotByCluster = new Map();
            const soloSlotIds = new Set();
            const soloClusterKeys = new Set();

            for (const slot of slots) {
              if (!slot) continue;
              if (slot.clusterKey) slotByCluster.set(slot.clusterKey, slot);
              if (!slot.enabled || !slot.solo) continue;
              soloSlotIds.add(slot.id);
              if (slot.clusterKey) soloClusterKeys.add(slot.clusterKey);
            }

            return {
              slotByCluster,
              soloSlotIds,
              soloClusterKeys,
              soloMode: soloSlotIds.size > 0
            };
          }

          export function identityNameForCluster(slot, clusterKey) {
            if (!slot || !clusterKey || slot.identityKey !== clusterKey) return '';
            return String(slot.identityName ?? '').trim();
          }

          export function operatorLabelForCluster(slot, clusterKey) {
            if (!slot) return '';
            const identityName = identityNameForCluster(slot, clusterKey);
            return identityName
              ? `${identityName}\nID ${slot.id}`
              : `ID ${slot.id}`;
          }
          """)

          Path("tests/operator-visual-state.test.mjs").write_text("""import assert from 'node:assert/strict';
          import test from 'node:test';
          import {
            deriveOperatorVisualState,
            identityNameForCluster,
            operatorLabelForCluster
          } from '../src/operator-visual-state.js';

          test('solo mode keeps every enabled solo slot as a focus target', () => {
            const state = deriveOperatorVisualState([
              { id: 1, enabled: true, solo: true, clusterKey: 'alice' },
              { id: 2, enabled: true, solo: false, clusterKey: 'bob' },
              { id: 3, enabled: true, solo: true, clusterKey: 'carol' }
            ]);

            assert.equal(state.soloMode, true);
            assert.deepEqual([...state.soloSlotIds], [1, 3]);
            assert.deepEqual([...state.soloClusterKeys], ['alice', 'carol']);
          });

          test('an enabled manual solo slot without a cluster still activates solo mode', () => {
            const state = deriveOperatorVisualState([
              { id: 1, enabled: true, solo: true, clusterKey: null }
            ]);

            assert.equal(state.soloMode, true);
            assert.equal(state.soloClusterKeys.size, 0);
          });

          test('disabled solo slots do not activate solo mode', () => {
            const state = deriveOperatorVisualState([
              { id: 1, enabled: false, solo: true, clusterKey: 'alice' }
            ]);

            assert.equal(state.soloMode, false);
          });

          test('identity names only follow the learned identity, not an operator override', () => {
            const lockedSlot = {
              id: 1,
              clusterKey: 'bob',
              identityKey: 'alice',
              identityName: 'Alice'
            };

            assert.equal(identityNameForCluster(lockedSlot, 'bob'), '');
            assert.equal(operatorLabelForCluster(lockedSlot, 'bob'), 'ID 1');
            assert.equal(identityNameForCluster(lockedSlot, 'alice'), 'Alice');
          });

          test('matching identities render above their ID in the 3D label', () => {
            const slot = {
              id: 4,
              clusterKey: 'singer-a',
              identityKey: 'singer-a',
              identityName: 'Singer A'
            };

            assert.equal(operatorLabelForCluster(slot, 'singer-a'), 'Singer A\nID 4');
          });
          """)

          # Viewer.
          path = Path("src/viewer.js")
          text = path.read_text()
          text = replace_once(
              text,
              "import { GHOST_CLUSTER_COLOR, clusterColorValue } from './cluster-color.js';\n",
              "import { GHOST_CLUSTER_COLOR, clusterColorValue } from './cluster-color.js';\n"
              "import { deriveOperatorVisualState, operatorLabelForCluster } from './operator-visual-state.js';\n",
              "viewer operator visual import",
          )

          constants = "const SOLO_DIMMED_BOX_OPACITY = 0.035;\n"                       "const SOLO_DIMMED_POINT_OPACITY = 0.02;\n"                       "const SOLO_DIMMED_LABEL_OPACITY = 0.025;\n"                       "const SOLO_DIMMED_VECTOR_OPACITY = 0.025;\n"                       "const SOLO_DIMMED_CENTROID_OPACITY = 0.035;\n"
          text = replace_once(
              text,
              "const LOOK_AT_MARKER_GHOST_OPACITY = 0.24;\n",
              "const LOOK_AT_MARKER_GHOST_OPACITY = 0.24;\n" + constants,
              "solo opacity constants",
          )

          text = replace_once(
              text,
              "  let selectedClusterKey = null;\n"
              "  let dropClusterKey = null;\n",
              "  let selectedClusterKey = null;\n"
              "  let dropClusterKey = null;\n"
              "  let soloMode = false;\n"
              "  let soloSlotIds = new Set();\n"
              "  let soloClusterKeys = new Set();\n",
              "viewer solo state",
          )

          text = replace_once(
              text,
              "    const centroid = new THREE.Mesh(\n"
              "      centroidGeometry,\n"
              "      new THREE.MeshBasicMaterial({ color })\n"
              "    );\n",
              "    const centroid = new THREE.Mesh(\n"
              "      centroidGeometry,\n"
              "      new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1 })\n"
              "    );\n",
              "centroid transparency",
          )

          text = replace_once(
              text,
              "      operatorStateReady: false,\n"
              "      operatorId: null,\n"
              "      clusterState: null,\n",
              "      operatorStateReady: false,\n"
              "      operatorId: null,\n"
              "      operatorLabelText: '',\n"
              "      clusterState: null,\n",
              "operator label state",
          )

          text = replace_once(
              text,
              "    const text = view.operatorStateReady\n"
              "      ? view.operatorId === null ? '' : String(view.operatorId)\n"
              "      : id !== undefined ? String(id) : uuid ? uuid.slice(0, 8) : '';\n",
              "    const text = view.operatorStateReady\n"
              "      ? view.operatorLabelText\n"
              "      : id !== undefined ? String(id) : uuid ? uuid.slice(0, 8) : '';\n",
              "identity-aware label text",
          )

          text = replace_once(
              text,
              "    view.label.material.opacity = state === ClusterState.Ghost ? 0.55 : 1;\n",
              "",
              "label opacity owned by interaction style",
          )

          old_style = """  function applyInteractionStyle(view) {
            if (view.clusterState === null) return;
            const selected = view.key === selectedClusterKey;
            const dropTarget = view.key === dropClusterKey;
            const baseColor = view.clusterState === ClusterState.Ghost ? GHOST_COLOR : view.color;
            const color = dropTarget ? DROP_TARGET_COLOR : baseColor;

            view.box.material.color.copy(color);
            view.lookAtMarker.material.color.copy(color);
            view.centroid.material.color.copy(color);
            view.velocity.setColor(color);
            view.points.material.color.copy(color);

            view.box.material.opacity = dropTarget || selected
              ? 1
              : view.clusterState === ClusterState.WillLeave ? 0.35 : 0.95;
            view.lookAtMarker.material.opacity = view.clusterState === ClusterState.Ghost
              ? LOOK_AT_MARKER_GHOST_OPACITY
              : view.clusterState === ClusterState.WillLeave
                ? LOOK_AT_MARKER_OPACITY * 0.55
                : LOOK_AT_MARKER_OPACITY;
            view.points.material.opacity = dropTarget || selected
              ? 1
              : view.clusterState === ClusterState.Ghost ? 0.45 : 0.92;
            view.centroid.scale.setScalar(dropTarget ? 1.8 : selected ? 1.45 : 1);
          }
          """
          new_style = """  function applyInteractionStyle(view) {
            if (view.clusterState === null) return;
            const selected = view.key === selectedClusterKey;
            const dropTarget = view.key === dropClusterKey;
            const soloDimmed = soloMode && !soloClusterKeys.has(view.key) && !dropTarget;
            const baseColor = view.clusterState === ClusterState.Ghost ? GHOST_COLOR : view.color;
            const color = dropTarget ? DROP_TARGET_COLOR : baseColor;

            view.box.material.color.copy(color);
            view.lookAtMarker.material.color.copy(color);
            view.centroid.material.color.copy(color);
            view.velocity.setColor(color);
            view.points.material.color.copy(color);

            view.box.material.opacity = soloDimmed
              ? SOLO_DIMMED_BOX_OPACITY
              : dropTarget || selected
                ? 1
                : view.clusterState === ClusterState.WillLeave ? 0.35 : 0.95;
            view.lookAtMarker.material.opacity = soloDimmed
              ? SOLO_DIMMED_VECTOR_OPACITY
              : view.clusterState === ClusterState.Ghost
                ? LOOK_AT_MARKER_GHOST_OPACITY
                : view.clusterState === ClusterState.WillLeave
                  ? LOOK_AT_MARKER_OPACITY * 0.55
                  : LOOK_AT_MARKER_OPACITY;
            view.points.material.opacity = soloDimmed
              ? SOLO_DIMMED_POINT_OPACITY
              : dropTarget || selected
                ? 1
                : view.clusterState === ClusterState.Ghost ? 0.45 : 0.92;
            view.centroid.material.opacity = soloDimmed ? SOLO_DIMMED_CENTROID_OPACITY : 1;
            view.label.material.opacity = soloDimmed
              ? SOLO_DIMMED_LABEL_OPACITY
              : view.clusterState === ClusterState.Ghost ? 0.55 : 1;
            setArrowOpacity(
              view.velocity,
              soloDimmed ? SOLO_DIMMED_VECTOR_OPACITY : 0.95
            );
            view.centroid.scale.setScalar(dropTarget ? 1.8 : selected ? 1.45 : 1);
          }
          """
          text = replace_once(text, old_style, new_style, "viewer solo dim style")

          old_operator = """  function setOperatorState(snapshot) {
            const slots = snapshot?.slots ?? [];
            const clusters = snapshot?.clusters ?? [];
            const selected = snapshot?.selected ?? null;
            const slotByCluster = new Map(
              slots.filter((slot) => slot.clusterKey).map((slot) => [slot.clusterKey, slot])
            );

            selectedClusterKey = selected?.type === 'cluster'
              ? selected.key
              : selected?.type === 'id'
                ? slots.find((slot) => slot.id === selected.id)?.clusterKey ?? null
                : null;

            for (const view of views.values()) {
              const slot = slotByCluster.get(view.key);
              view.operatorStateReady = true;
              view.operatorId = slot?.id ?? null;
              updateLabel(view, view.sourceId, view.uuid);
            }

            syncManualViews(slots, clusters);
            refreshInteractionStyles();
          }
          """
          new_operator = """  function setOperatorState(snapshot) {
            const slots = snapshot?.slots ?? [];
            const clusters = snapshot?.clusters ?? [];
            const selected = snapshot?.selected ?? null;
            const operatorVisualState = deriveOperatorVisualState(slots);
            const slotByCluster = operatorVisualState.slotByCluster;
            soloMode = operatorVisualState.soloMode;
            soloSlotIds = operatorVisualState.soloSlotIds;
            soloClusterKeys = operatorVisualState.soloClusterKeys;

            selectedClusterKey = selected?.type === 'cluster'
              ? selected.key
              : selected?.type === 'id'
                ? slots.find((slot) => slot.id === selected.id)?.clusterKey ?? null
                : null;

            for (const view of views.values()) {
              const slot = slotByCluster.get(view.key);
              view.operatorStateReady = true;
              view.operatorId = slot?.id ?? null;
              view.operatorLabelText = operatorLabelForCluster(slot, view.key);
              updateLabel(view, view.sourceId, view.uuid);
            }

            syncManualViews(slots, clusters);
            refreshInteractionStyles();
          }
          """
          text = replace_once(text, old_operator, new_operator, "viewer operator state")

          text = replace_once(
              text,
              "      updateManualLink(view);\n",
              "      applyManualSoloStyle(view, soloMode && !soloSlotIds.has(slot.id));\n"
              "      updateManualLink(view);\n",
              "manual solo style call",
          )

          manual_marker = "  function updateManualLink(view) {\n"
          manual_style = """  function applyManualSoloStyle(view, dimmed) {
            view.box.material.opacity = dimmed ? SOLO_DIMMED_BOX_OPACITY : 0.92;
            view.centroid.material.opacity = dimmed ? SOLO_DIMMED_CENTROID_OPACITY : 0.95;
            view.link.material.opacity = dimmed ? SOLO_DIMMED_VECTOR_OPACITY : 0.42;
            view.label.material.opacity = dimmed ? SOLO_DIMMED_LABEL_OPACITY : 1;
          }

          """
          text = replace_once(text, manual_marker, manual_style + manual_marker, "manual solo helper")

          text = replace_once(
              text,
              "function updateVelocity(arrow, origin, velocity, color, direction) {\n",
              "function setArrowOpacity(arrow, opacity) {\n"
              "  arrow.line.material.opacity = opacity;\n"
              "  arrow.cone.material.opacity = opacity;\n"
              "}\n\n"
              "function updateVelocity(arrow, origin, velocity, color, direction) {\n",
              "arrow opacity helper",
          )

          old_label = """function createLabelSprite(text, color) {
            const material = new THREE.SpriteMaterial({
              map: makeLabelTexture(text, color),
              transparent: true,
              depthTest: false,
              depthWrite: false
            });
            const sprite = new THREE.Sprite(material);
            sprite.scale.set(0.72, 0.28, 1);
            sprite.renderOrder = 10;
            return sprite;
          }

          function replaceLabelTexture(sprite, text, color) {
            sprite.material.map?.dispose();
            sprite.material.map = makeLabelTexture(text, color);
            sprite.material.needsUpdate = true;
          }

          function makeLabelTexture(text, color) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 96;

            const ctx = canvas.getContext('2d');
            if (!ctx) return new THREE.CanvasTexture(canvas);

            const cssColor = `#${color.getHexString()}`;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            roundedRect(ctx, 24, 16, 208, 64, 22);
            ctx.fillStyle = 'rgba(10, 13, 18, 0.88)';
            ctx.fill();

            ctx.strokeStyle = cssColor;
            ctx.lineWidth = 5;
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.font = '500 38px Inter, Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 128, 49);

            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            texture.minFilter = THREE.LinearFilter;
            texture.magFilter = THREE.LinearFilter;
            texture.generateMipmaps = false;
            return texture;
          }
          """
          new_label = """function createLabelSprite(text, color) {
            const material = new THREE.SpriteMaterial({
              map: makeLabelTexture(text, color),
              transparent: true,
              depthTest: false,
              depthWrite: false
            });
            const sprite = new THREE.Sprite(material);
            updateLabelScale(sprite, text);
            sprite.renderOrder = 10;
            return sprite;
          }

          function replaceLabelTexture(sprite, text, color) {
            sprite.material.map?.dispose();
            sprite.material.map = makeLabelTexture(text, color);
            sprite.material.needsUpdate = true;
            updateLabelScale(sprite, text);
          }

          function updateLabelScale(sprite, text) {
            sprite.scale.set(1.0, String(text).includes('\n') ? 0.36 : 0.31, 1);
          }

          function makeLabelTexture(text, color) {
            const canvas = document.createElement('canvas');
            canvas.width = 384;
            canvas.height = 128;

            const ctx = canvas.getContext('2d');
            if (!ctx) return new THREE.CanvasTexture(canvas);

            const cssColor = `#${color.getHexString()}`;
            const lines = String(text ?? '').split('\n', 2);

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            roundedRect(ctx, 20, 14, 344, 100, 24);
            ctx.fillStyle = 'rgba(10, 13, 18, 0.88)';
            ctx.fill();

            ctx.strokeStyle = cssColor;
            ctx.lineWidth = 5;
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            if (lines.length > 1) {
              ctx.font = '600 40px Inter, Arial, sans-serif';
              ctx.fillText(lines[0], 192, 46, 320);
              ctx.fillStyle = 'rgba(255, 255, 255, 0.74)';
              ctx.font = '500 24px Inter, Arial, sans-serif';
              ctx.fillText(lines[1], 192, 86, 320);
            } else {
              ctx.font = '500 42px Inter, Arial, sans-serif';
              ctx.fillText(lines[0], 192, 65, 320);
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            texture.minFilter = THREE.LinearFilter;
            texture.magFilter = THREE.LinearFilter;
            texture.generateMipmaps = false;
            return texture;
          }
          """
          text = replace_once(text, old_label, new_label, "multiline identity labels")
          path.write_text(text)

          # ID interface: the tray follows the same strong solo focus.
          path = Path("src/id-interface.js")
          text = path.read_text()
          text = replace_once(
              text,
              "import { clusterDisplayColorCss } from './cluster-color.js';\n",
              "import { clusterDisplayColorCss } from './cluster-color.js';\n"
              "import { deriveOperatorVisualState } from './operator-visual-state.js';\n",
              "interface operator visual import",
          )
          text = replace_once(
              text,
              "    const soloMode = snapshot.slots.some((slot) => slot.enabled && slot.solo);\n"
              "    idList.classList.toggle('solo-mode', soloMode);\n",
              "    const operatorVisualState = deriveOperatorVisualState(snapshot.slots);\n"
              "    const soloMode = operatorVisualState.soloMode;\n"
              "    idList.classList.toggle('solo-mode', soloMode);\n"
              "    clusterTray.classList.toggle('solo-mode', soloMode);\n",
              "interface solo state",
          )
          text = replace_once(
              text,
              "        chip.style.setProperty(\n"
              "          '--cluster-color',\n"
              "          clusterDisplayColorCss(cluster.key, cluster.sourceId, cluster.ghost)\n"
              "        );\n",
              "        chip.style.setProperty(\n"
              "          '--cluster-color',\n"
              "          clusterDisplayColorCss(cluster.key, cluster.sourceId, cluster.ghost)\n"
              "        );\n"
              "        const isSolo = operatorVisualState.soloClusterKeys.has(cluster.key);\n"
              "        chip.classList.toggle('is-solo', isSolo);\n"
              "        chip.classList.toggle('is-solo-muted', soloMode && !isSolo);\n",
              "cluster tray solo classes",
          )
          path.write_text(text)

          # CSS: put the 3D stage behind the operator layers and make left/bottom
          # controls transparent instead of placing them on opaque cards.
          path = Path("src/styles.css")
          text = path.read_text()
          text = replace_once(
              text,
              """.workspace {
            min-height: 0;
            min-width: 0;
            display: grid;
            grid-template-columns: var(--left-width) minmax(0, 1fr) var(--right-width);
            gap: 8px;
            padding: 8px;
          }
          """,
              """.workspace {
            position: relative;
            min-height: 0;
            min-width: 0;
            display: block;
            padding: 8px;
          }
          """,
              "desktop workspace overlay",
          )
          text = replace_once(
              text,
              ".id-panel { display: grid; grid-template-rows: auto auto minmax(0,1fr); }\n",
              ".id-panel {\n"
              "  position: absolute;\n"
              "  z-index: 12;\n"
              "  top: 12px;\n"
              "  bottom: 12px;\n"
              "  left: 12px;\n"
              "  width: var(--left-width);\n"
              "  display: grid;\n"
              "  grid-template-rows: auto auto minmax(0,1fr);\n"
              "  border-color: transparent;\n"
              "  background: transparent;\n"
              "  box-shadow: none;\n"
              "}\n",
              "transparent id panel",
          )
          text = replace_once(
              text,
              ".stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; border: 1px solid var(--panel-line); border-radius: 11px; background: var(--stage-bg); box-shadow: var(--panel-shadow); }\n",
              ".stage { position: absolute; z-index: 0; inset: 8px; min-width: 0; min-height: 0; overflow: hidden; border: 1px solid var(--panel-line); border-radius: 11px; background: var(--stage-bg); box-shadow: var(--panel-shadow); }\n",
              "stage underlays panels",
          )
          text = replace_once(
              text,
              ".inspector-panel { overflow-y: auto; scrollbar-width: thin; scrollbar-color: #555 transparent; }\n",
              ".inspector-panel {\n"
              "  position: absolute;\n"
              "  z-index: 12;\n"
              "  top: 12px;\n"
              "  right: 12px;\n"
              "  bottom: 12px;\n"
              "  width: var(--right-width);\n"
              "  overflow-y: auto;\n"
              "  border-color: rgba(255,255,255,.055);\n"
              "  background: rgba(24,24,24,.62);\n"
              "  box-shadow: 0 8px 22px rgba(0,0,0,.16);\n"
              "  backdrop-filter: blur(12px);\n"
              "  scrollbar-width: thin;\n"
              "  scrollbar-color: #555 transparent;\n"
              "}\n",
              "alpha inspector panel",
          )
          old_dock = """.cluster-dock {
            position: absolute;
            z-index: 7;
            left: 50%;
            bottom: 13px;
            width: min(780px, calc(100% - 26px));
            transform: translateX(-50%);
            padding: 8px;
            border: 1px solid var(--line-soft);
            border-radius: 10px;
            background: rgba(39,39,39,.86);
            box-shadow: 0 9px 25px rgba(0,0,0,.22);
            backdrop-filter: blur(14px);
          }
          """
          new_dock = """.cluster-dock {
            position: absolute;
            z-index: 7;
            left: 50%;
            bottom: 13px;
            width: min(780px, calc(100% - 26px));
            transform: translateX(-50%);
            padding: 0;
            border: 0;
            border-radius: 0;
            background: transparent;
            box-shadow: none;
            backdrop-filter: none;
          }
          """
          text = replace_once(text, old_dock, new_dock, "transparent cluster dock")

          # Update the final semantic grammar rather than reintroducing opaque cards.
          text = replace_once(
              text,
              ".id-row.is-empty { background: #303030; }\n",
              ".id-row.is-empty { background: rgba(18,18,18,.06); }\n",
              "transparent empty row",
          )
          old_filled = """.id-row.is-filled {
            border-color: color-mix(in srgb, var(--cluster-color) 62%, var(--line));
            background: linear-gradient(
              90deg,
              color-mix(in srgb, var(--cluster-color) 36%, #252525),
              color-mix(in srgb, var(--cluster-color) 18%, #292929)
            );
          }
          """
          new_filled = """.id-row.is-filled {
            border-color: color-mix(in srgb, var(--cluster-color) 72%, var(--line));
            background: linear-gradient(
              90deg,
              color-mix(in srgb, var(--cluster-color) 18%, transparent),
              color-mix(in srgb, var(--cluster-color) 5%, transparent)
            );
          }
          """
          text = replace_once(text, old_filled, new_filled, "transparent filled row")
          text = replace_once(
              text,
              "  background: repeating-linear-gradient(135deg, #292929 0 8px, #303030 8px 10px);\n",
              "  background: rgba(18,18,18,.04);\n"
              "  border-style: dashed;\n",
              "transparent disabled row",
          )
          old_locked_empty = """.id-row.is-empty.is-locked {
            background: repeating-linear-gradient(
              135deg,
              #303030 0 9px,
              color-mix(in srgb, var(--warning) 10%, #303030) 9px 11px
            );
          }
          """
          text = replace_once(
              text,
              old_locked_empty,
              ".id-row.is-empty.is-locked { background: rgba(18,18,18,.06); }\n",
              "transparent locked empty row",
          )
          text = replace_once(
              text,
              ".id-list.solo-mode .id-row.is-solo-muted { opacity: .28; filter: saturate(.2); }\n",
              ".id-list.solo-mode .id-row.is-solo-muted { opacity: .08; filter: saturate(.12) brightness(.58); }\n",
              "strong slot solo dim",
          )
          old_chip = """.cluster-chip {
            --cluster-color: var(--positive);
            border-color: color-mix(in srgb, var(--cluster-color) 38%, var(--line-soft));
            background: color-mix(in srgb, var(--cluster-color) 11%, rgba(255,255,255,.045));
          }
          .cluster-chip:hover {
