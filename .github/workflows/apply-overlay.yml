name: Apply prototype overlay

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-overlay.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Apply exact prototype overlay
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .bootstrap/overlay.part00 \
            .bootstrap/overlay.part01 \
            .bootstrap/overlay.part02 \
            .bootstrap/overlay.part03 \
            .bootstrap/p4.00a \
            .bootstrap/p4.00b00 \
            .bootstrap/p4.00b010 \
            .bootstrap/p4.00b011 \
            .bootstrap/p4.00b012 \
            .bootstrap/p4.00b1 \
            .bootstrap/p4.01 \
            .bootstrap/p4.02 \
            .bootstrap/p4.03 \
            .bootstrap/p4.04 \
            .bootstrap/p4.05 > /tmp/overlay.b64
          test "$(sha256sum /tmp/overlay.b64 | cut -d' ' -f1)" = "3d44f19e4c3e3df779eeef933f177ce108c072aea694456fb0f446e54efc0368"
          base64 -d /tmp/overlay.b64 > /tmp/overlay.zip
          test "$(sha256sum /tmp/overlay.zip | cut -d' ' -f1)" = "219840b3b3515c6934c5049e56c030745a6ef6516d77d198f86b467c3157a313"
          mkdir -p /tmp/overlay
          unzip -q /tmp/overlay.zip -d /tmp/overlay
          cp -a /tmp/overlay/TrackingID-interface-proto-overlay/. .
          rm -rf .bootstrap

      - name: Commit prototype
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prototype ID management operator interface"
          git push
