name: Apply prototype overlay

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-overlay.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Apply exact prototype overlay
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/overlay.part* > /tmp/overlay.b64
          base64 -d /tmp/overlay.b64 > /tmp/overlay.zip
          mkdir -p /tmp/overlay
          unzip -q /tmp/overlay.zip -d /tmp/overlay
          cp -a /tmp/overlay/TrackingID-interface-proto-overlay/. .
          rm -rf .bootstrap

      - name: Commit prototype
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prototype ID management operator interface"
          git push
