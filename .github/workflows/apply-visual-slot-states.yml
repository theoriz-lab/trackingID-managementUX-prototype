name: Apply visual slot grammar

on:
  push:
    branches: [ux/visual-slot-states]
    paths:
      - '.github/workflows/apply-visual-slot-states.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Apply visual grammar
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected 1 occurrence, found {count}")
              return text.replace(old, new, 1)

          # Viewer: use the exact same semantic cluster color as the operator UI.
          path = Path("src/viewer.js")
          text = path.read_text()
          text = replace_once(
              text,
              "import { VIEW_TRANSITION, viewTransitionEase } from './view-transition.js';\n",
              "import { VIEW_TRANSITION, viewTransitionEase } from './view-transition.js';\n"
              "import { GHOST_CLUSTER_COLOR, clusterColorValue } from './cluster-color.js';\n",
              "viewer shared color import",
          )
          text = replace_once(
              text,
              "const GHOST_COLOR = new THREE.Color(0x8a909b);\n",
              "const GHOST_COLOR = new THREE.Color(GHOST_CLUSTER_COLOR);\n",
              "viewer ghost color",
          )
          text = replace_once(text, "const SELECTED_COLOR = new THREE.Color(0xbd7bd4);\n", "", "selected color")
          palette_start = text.index("const SESSION_COLOR_OFFSET =")
          palette_end = text.index("\n\nexport function createViewer", palette_start)
          text = text[:palette_start] + text[palette_end + 2:]
          text = replace_once(
              text,
              "    const color = dropTarget ? DROP_TARGET_COLOR : selected ? SELECTED_COLOR : baseColor;\n",
              "    const color = dropTarget ? DROP_TARGET_COLOR : baseColor;\n",
              "selection keeps semantic color",
          )
          color_start = text.index("function objectColor(key, id) {")
          color_end = text.index("// Scene dimensions are magnitudes.", color_start)
          text = (
              text[:color_start]
              + "function objectColor(key, id) {\n"
                "  return new THREE.Color(clusterColorValue(key, id));\n"
                "}\n\n"
              + text[color_end:]
          )
          path.write_text(text)

          # Operator UI: decorate the existing rows after rendering instead of
          # duplicating state markup or the cluster palette.
          path = Path("src/id-interface.js")
          text = path.read_text()
          if "clusterDisplayColorCss" not in text:
              text = "import { clusterDisplayColorCss } from './cluster-color.js';\n\n" + text
          text = replace_once(text, "    free: 'Free',", "    free: 'Empty',", "empty label")
          text = replace_once(
              text,
              "            ${slot.manual ? '<span class=\"mini-flag\">MANUAL</span>' : ''}\n",
              "            ${slot.manual ? '<span class=\"mini-flag manual\">MANUAL</span>' : ''}\n",
              "manual flag",
          )
          text = replace_once(
              text,
              "      : '<div class=\"tray-empty\">Waiting for live clusters…</div>';\n\n"
              "    liveCount.textContent",
              "      : '<div class=\"tray-empty\">Waiting for live clusters…</div>';\n\n"
              "    applyVisualGrammar(snapshot, clusterByKey, visibleClusters);\n\n"
              "    liveCount.textContent",
              "visual grammar render hook",
          )
          marker = "  function renderInspector(snapshot, clusterByKey) {\n"
          visual_function = """  function applyVisualGrammar(snapshot, clusterByKey, visibleClusters) {
            const soloMode = snapshot.slots.some((slot) => slot.enabled && slot.solo);
            idList.classList.toggle('solo-mode', soloMode);

            idList.querySelectorAll('.id-row').forEach((row, index) => {
              const slot = snapshot.slots[index];
              if (!slot) return;
              const cluster = slot.clusterKey ? clusterByKey.get(slot.clusterKey) : null;
              const filled = Boolean(cluster?.visible) || slot.manual;
              const warning = identityWarning(slot);
              const color = cluster
                ? clusterDisplayColorCss(cluster.key, cluster.sourceId, cluster.ghost)
                : slot.manual
                  ? '#bd7bd4'
                  : '';

              row.classList.toggle('is-enabled', slot.enabled);
              row.classList.toggle('is-disabled', !slot.enabled);
              row.classList.toggle('is-filled', filled);
              row.classList.toggle('is-empty', !filled);
              row.classList.toggle('is-locked', slot.locked);
              row.classList.toggle('is-solo', slot.solo);
              row.classList.toggle('is-solo-muted', soloMode && !slot.solo);
              row.classList.toggle('has-override', warning?.type === 'override');

              if (color) row.style.setProperty('--cluster-color', color);
              else row.style.removeProperty('--cluster-color');
            });

            clusterTray.querySelectorAll('.cluster-chip').forEach((chip, index) => {
              const cluster = visibleClusters[index];
              if (!cluster) return;
              chip.style.setProperty(
                '--cluster-color',
                clusterDisplayColorCss(cluster.key, cluster.sourceId, cluster.ghost)
              );
            });
          }

          """
          text = replace_once(text, marker, visual_function + marker, "visual grammar function")
          path.write_text(text)

          # The visual grammar intentionally lives as an override layer so it is
          # easy to tune during this prototype without disturbing Pleiades base tokens.
          path = Path("src/styles.css")
          text = path.read_text()
          css_marker = "/* ID operator visual grammar v0.3 */"
          if css_marker in text:
              raise RuntimeError("visual grammar CSS already present")
          text += r'''

          /* ID operator visual grammar v0.3 */
          .id-row {
            --cluster-color: #707070;
            position: relative;
            isolation: isolate;
            min-height: 56px;
            grid-template-columns: 22px minmax(0,1fr) auto 30px;
            gap: 7px;
            overflow: hidden;
            padding: 5px 7px 5px 5px;
            border: 1px solid var(--line-soft);
            border-radius: 8px;
            background: #303030;
          }
          .id-row::before {
            content: "";
            position: absolute;
            z-index: -1;
            inset: 0 auto 0 0;
            width: 4px;
            background: #626262;
            opacity: .55;
          }
          .id-row.is-empty { background: #303030; }
          .id-row.is-enabled.is-empty::before { background: var(--positive); opacity: .72; }
          .id-row.is-filled {
            border-color: color-mix(in srgb, var(--cluster-color) 62%, var(--line));
            background: linear-gradient(
              90deg,
              color-mix(in srgb, var(--cluster-color) 36%, #252525),
              color-mix(in srgb, var(--cluster-color) 18%, #292929)
            );
          }
          .id-row.is-filled::before { background: var(--cluster-color); opacity: 1; }
          .id-row.is-disabled {
            opacity: .52;
            filter: saturate(.12);
            background: repeating-linear-gradient(135deg, #292929 0 8px, #303030 8px 10px);
          }
          .id-row.is-disabled::before { background: #747474; opacity: .34; }
          .id-row.is-empty.is-locked {
            background: repeating-linear-gradient(
              135deg,
              #303030 0 9px,
              color-mix(in srgb, var(--warning) 10%, #303030) 9px 11px
            );
          }
          .id-row.is-locked::after {
            content: "";
            position: absolute;
            z-index: 3;
            inset: 1px;
            border: 2px solid color-mix(in srgb, var(--warning) 82%, transparent);
            border-radius: 7px;
            pointer-events: none;
          }
          .id-row.has-override::after {
            border-color: color-mix(in srgb, var(--danger) 90%, transparent);
            box-shadow: inset 0 0 18px color-mix(in srgb, var(--danger) 12%, transparent);
          }
          .id-row.selected {
            outline: 2px solid rgba(255,255,255,.86);
            outline-offset: -2px;
          }
          .id-row.drop-target {
            outline: 2px solid var(--accent);
            outline-offset: -2px;
            box-shadow: inset 0 0 18px rgba(189,123,212,.16);
          }
          .id-list.solo-mode .id-row.is-solo-muted { opacity: .28; filter: saturate(.2); }
          .id-row.is-solo:not(.selected) {
            box-shadow: inset 0 -2px 0 color-mix(in srgb, var(--positive) 62%, transparent);
          }

          .id-main {
            min-height: 43px;
            grid-template-columns: 46px minmax(0,1fr);
            gap: 8px;
          }
          .id-number {
            position: relative;
            padding-right: 8px;
            color: #f0edf0;
            font-size: 23px;
            font-weight: 690;
            line-height: 1;
            text-align: right;
          }
          .id-number::after {
            content: "";
            position: absolute;
            right: 0;
            bottom: 1px;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #676267;
          }
          .id-row.is-enabled.is-empty .id-number::after {
            background: var(--positive);
            box-shadow: 0 0 0 2px rgba(85,215,137,.10);
          }
          .id-row.is-filled .id-number::after {
            background: var(--cluster-color);
            box-shadow: 0 0 0 2px color-mix(in srgb, var(--cluster-color) 18%, transparent);
          }
          .id-row.is-empty .id-copy strong { color: #b8b3b8; }
          .state-mark { display: none; }

          .mini-flag {
            background: rgba(0,0,0,.13);
            font-weight: 670;
          }
          .id-row.is-locked .mini-flag.accent { display: none; }
          .mini-flag.warning {
            border-color: color-mix(in srgb, var(--danger) 40%, transparent);
            color: color-mix(in srgb, var(--danger) 90%, white);
          }
          .mini-flag.manual {
            border-color: rgba(189,123,212,.28);
            color: var(--accent-text);
          }

          /* Reuse the existing lock action button as a consistent vector lock icon. */
          .row-action {
            position: relative;
            width: 29px;
            height: 31px;
            border-radius: 6px;
            color: #837e83;
            font-size: 0;
          }
          .row-action.active {
            background: rgba(231,191,104,.10);
            color: var(--warning);
          }
          .row-action::before {
            content: "";
            position: absolute;
            left: 9px;
            top: 13px;
            width: 10px;
            height: 9px;
            border: 1.5px solid currentColor;
            border-radius: 2px;
          }
          .row-action::after {
            content: "";
            position: absolute;
            left: 11px;
            top: 7px;
            width: 6px;
            height: 7px;
            border: 1.5px solid currentColor;
            border-bottom: 0;
            border-radius: 6px 6px 0 0;
            transform-origin: 1px 7px;
            transition: transform var(--motion-base) var(--motion-ease-out);
          }
          .row-action:not(.active)::after { transform: translate(3px,-1px) rotate(32deg); }

          .cluster-chip {
            --cluster-color: var(--positive);
            border-color: color-mix(in srgb, var(--cluster-color) 38%, var(--line-soft));
            background: color-mix(in srgb, var(--cluster-color) 11%, rgba(255,255,255,.045));
          }
          .cluster-chip:hover {
            background: color-mix(in srgb, var(--cluster-color) 17%, rgba(255,255,255,.055));
          }
          .cluster-chip.selected {
            outline: 2px solid rgba(255,255,255,.82);
            outline-offset: -2px;
            border-color: color-mix(in srgb, var(--cluster-color) 52%, var(--line));
          }
          .cluster-chip.drop-target {
            outline: 2px solid var(--accent);
            outline-offset: -2px;
          }
          .cluster-chip.ghost { opacity: .68; filter: saturate(.38); }
          .cluster-live-dot,
          .cluster-chip.ghost .cluster-live-dot {
            background: var(--cluster-color);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--cluster-color) 10%, transparent);
          }

          .id-list.dense .id-row { min-height: 42px; }
          .id-list.dense .id-main { min-height: 33px; }
          .id-list.dense .id-number { font-size: 17px; }

          @media (max-width: 820px), (pointer: coarse) and (max-width: 980px) {
            .id-row { min-height: 54px; }
            .id-number { font-size: 22px; }
          }
          '''
          path.write_text(text)

          # Test the shared color contract without making color values fixed across sessions.
          Path("tests/cluster-color.test.mjs").write_text("""import assert from 'node:assert/strict';
          import test from 'node:test';
          import {
            GHOST_CLUSTER_COLOR,
            clusterColorCss,
            clusterColorValue,
            clusterDisplayColorCss
          } from '../src/cluster-color.js';

          test('cluster color mapping is stable within a session', () => {
            assert.equal(clusterColorValue('/Demo|alice', 1), clusterColorValue('/Other|alice', 1));
            assert.equal(clusterColorCss('/Demo|alice', 1), clusterColorCss('/Demo|alice', 1));
          });

          test('cluster CSS color exactly represents the shared numeric color', () => {
            const value = clusterColorValue('/Demo|alice', 1);
            assert.equal(clusterColorCss('/Demo|alice', 1), `#${value.toString(16).padStart(6, '0')}`);
          });

          test('ghost display color uses the shared ghost gray', () => {
            assert.equal(
              clusterDisplayColorCss('/Demo|alice', 1, true),
              `#${GHOST_CLUSTER_COLOR.toString(16).padStart(6, '0')}`
            );
          });
          """)

          # Document the visual invariants so later UI iterations don't regress them.
          path = Path("README.md")
          text = path.read_text()
          marker = "- Selecting an ID or cluster highlights the corresponding tracked person in 3D.\n"
          addition = (
              marker
              + "- Slot visuals use a strict operator grammar: gray means empty, an occupied slot inherits the exact live cluster color, enabled empty slots keep a small green activity cue, and disabled slots are visibly muted.\n"
              + "- Lock is a separate visual layer: a closed padlock plus an amber frame. A locked empty/reserved slot stays gray so occupancy and reservation cannot be confused.\n"
              + "- Selection uses a neutral white outline instead of replacing the cluster color. Solo dims non-solo slots, while Manual and Override remain explicit secondary badges.\n"
          )
          text = replace_once(text, marker, addition, "README visual grammar")
          path.write_text(text)

          path = Path("AGENTS.md")
          text = path.read_text()
          marker = "- Follow Pleiades FrontEnd3 tokens and interaction language rather than creating a separate visual system.\n"
          addition = (
              marker
              + "- Treat slot visuals as semantic layers: occupancy controls the fill, the shared cluster color identifies the occupant, lock controls the frame/padlock, and selection uses a neutral outline. Do not overload one color with multiple meanings.\n"
              + "- Cluster colors must come from `src/cluster-color.js`; never duplicate the palette or color-selection rule in the viewer or operator UI.\n"
          )
          text = replace_once(text, marker, addition, "AGENTS visual grammar")
          path.write_text(text)
          PY

          git diff --check
          rm .github/workflows/apply-visual-slot-states.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply visual ID slot grammar"
          git push
