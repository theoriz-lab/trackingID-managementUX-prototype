name: Apply capsule interface

on:
  push:
    branches: [ux/capsule-manual-workflow]
    paths:
      - '.github/workflows/apply-capsule-interface.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assemble verified interface payload
        shell: bash
        run: |
          cat .tmp/id-interface.00 .tmp/id-interface.01 .tmp/id-interface.02 .tmp/id-interface.03 \
              .tmp/id-interface.04 .tmp/id-interface.05 .tmp/id-interface.06 .tmp/id-interface.07 \
            | base64 --decode > src/id-interface.js
          node --input-type=module --check < src/id-interface.js
          rm -rf .tmp
          rm .github/workflows/apply-capsule-interface.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace inspector with draggable ID capsules"
          git push
