name: Tidy visual slot grammar

on:
  push:
    branches: [ux/visual-slot-states]
    paths:
      - '.github/workflows/tidy-visual-slot-states.yml'

permissions:
  contents: write

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tidy visual implementation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/id-interface.js")
          text = path.read_text()
          start = text.index("  function applyVisualGrammar(")
          end = text.index("  function renderInspector(", start)
          block = text[start:end]
          lines = block.splitlines()
          tidy = "\n".join([lines[0], *[("  " + line if line else line) for line in lines[1:]]]) + "\n\n"
          text = text[:start] + tidy + text[end:]
          path.write_text(text)

          path = Path("src/styles.css")
          text = path.read_text()
          marker = "/* Preserve semantic cluster color on selected tray chips. */"
          if marker not in text:
              text += """
          
          /* Preserve semantic cluster color on selected tray chips. */
          .cluster-chip.selected {
            background: color-mix(in srgb, var(--cluster-color) 20%, #2b2b2b);
          }
          """
          path.write_text(text)
          PY

          git diff --check
          rm .github/workflows/tidy-visual-slot-states.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Tidy visual slot state implementation"
          git push
