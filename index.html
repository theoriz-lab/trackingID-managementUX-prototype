<!doctype html>
<html lang="en" style="background:#181818;color-scheme:dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#181818">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/png" href="./augmenta-favicon.png?v=4">
  <link rel="shortcut icon" type="image/png" href="./augmenta-favicon.png?v=4">
  <link rel="apple-touch-icon" href="./augmenta-favicon.png?v=4">
  <title>Augmenta ID Management Prototype</title>
  <meta name="description" content="Prototype operator interface for Augmenta ID assignment, identity lock and manual takeover.">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="./src/styles.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
      "augmenta-client-sdk": "./vendor/AugmentaClientSDK-JS/dist/esm/index.js"
    }
  }
  </script>
  <!-- Kept for compatibility with the inherited self-contained Pages assembler. -->
  <link rel="modulepreload" href="./src/qr.js">
</head>
<body data-mobile-pane="ids">
  <main id="app">
    <header class="app-header">
      <div class="brand-block">
        <a class="brand-mark" href="https://augmenta.tech" target="_blank" rel="noopener noreferrer" aria-label="Open Augmenta website">
          <img src="./augmenta-favicon.png?v=4" alt="">
        </a>
        <div class="title-block">
          <strong>ID Management</strong>
          <span>Operator prototype</span>
        </div>
      </div>

      <div class="header-context" aria-label="Live tracking status">
        <div class="context-item scene-context">
          <span class="context-label">Scene</span>
          <strong id="scene-label">All scenes</strong>
        </div>
        <div class="context-item">
          <span class="context-label">Tracking</span>
          <strong id="live-count">0 live</strong>
        </div>
        <div class="context-item">
          <span class="context-label">Slots</span>
          <strong id="slot-count">12 IDs</strong>
        </div>
      </div>

      <div class="header-actions">
        <button id="warning-button" class="warning-button" type="button" hidden>0 warnings</button>
        <button class="header-button" type="button" data-action="unlock-all">Unlock all</button>
        <button class="header-button accent" type="button" data-action="lock-all">Lock active</button>
        <div class="connection-pill" title="Automatic Augmenta connection">
          <i aria-hidden="true"></i>
          <span id="connection-status">Connecting</span>
        </div>
      </div>
    </header>

    <div class="workspace">
      <aside class="panel id-panel" aria-label="ID slots">
        <div class="panel-header">
          <div>
            <span class="eyebrow">Tracking output</span>
            <h1>IDs</h1>
          </div>
          <button class="icon-text-button" type="button" data-action="add-slots" title="Add four prototype ID slots">+4</button>
        </div>
        <div class="panel-help">Drag a slot onto a live cluster, or drag a cluster onto a slot.</div>
        <div id="id-list" class="id-list"></div>
      </aside>

      <section class="stage" aria-label="Live tracking view">
        <div id="canvas-host" class="canvas-host"></div>
        <div class="stage-overlay top-left">
          <span class="stage-kicker">Live spatial view</span>
          <strong>Tracking</strong>
        </div>
        <div class="stage-overlay top-right connection-detail">
          <span id="connection-note">Connecting automatically with Augmenta defaults…</span>
        </div>
        <div class="cluster-dock" aria-label="Live clusters">
          <div class="cluster-dock-label">Live clusters</div>
          <div id="cluster-tray" class="cluster-tray">
            <div class="tray-empty">Waiting for live clusters…</div>
          </div>
        </div>
      </section>

      <aside class="panel inspector-panel" aria-label="Selection inspector">
        <div id="inspector-content" class="inspector-content"></div>
      </aside>
    </div>

    <nav id="mobile-tabs" class="mobile-tabs" aria-label="Operator panels" role="tablist">
      <button type="button" role="tab" data-action="mobile-pane" data-pane="ids" class="active" aria-selected="true">IDs</button>
      <button type="button" role="tab" data-action="mobile-pane" data-pane="inspector" aria-selected="false">Inspector</button>
    </nav>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
