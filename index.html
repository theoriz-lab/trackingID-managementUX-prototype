<!doctype html>
<html lang="en" style="background:#0d1117;color-scheme:dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/png" href="./augmenta-favicon.png?v=4">
  <link rel="shortcut icon" type="image/png" href="./augmenta-favicon.png?v=4">
  <link rel="apple-touch-icon" href="./augmenta-favicon.png?v=4">
  <title>Augmenta ID Management Prototype</title>
  <meta name="description" content="Prototype operator interface for Augmenta ID assignment, identity lock and manual takeover.">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="./src/styles.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
      "augmenta-client-sdk": "./vendor/AugmentaClientSDK-JS/dist/esm/index.js"
    }
  }
  </script>
</head>
<body>
  <main id="app">
    <div class="workspace">
      <section class="stage" aria-label="Live tracking view">
        <div id="canvas-host" class="canvas-host"></div>

        <div class="stage-status">
          <span id="scene-label">All scenes</span>
          <span id="connection-note">Connecting automatically with Augmenta defaults…</span>
        </div>

        <div id="camera-cube" class="camera-cube" aria-label="Camera orbit cube">
          <div class="camera-orbit-ring" aria-hidden="true"></div>
          <div class="camera-cube-inner">
            <button class="camera-face camera-face-front" type="button" data-camera-view="front" aria-label="Front view">F</button>
            <button class="camera-face camera-face-back" type="button" data-camera-view="back" aria-label="Back view">B</button>
            <button class="camera-face camera-face-right" type="button" data-camera-view="right" aria-label="Right view">R</button>
            <button class="camera-face camera-face-left" type="button" data-camera-view="left" aria-label="Left view">L</button>
            <button class="camera-face camera-face-top" type="button" data-camera-view="top" aria-label="Top view">Y</button>
            <button class="camera-face camera-face-bottom" type="button" data-camera-view="bottom" aria-label="Bottom view">−Y</button>
          </div>
          <span class="camera-cube-hint">drag to orbit</span>
        </div>

        <div class="cluster-dock" aria-label="Live clusters">
          <div class="cluster-dock-header">
            <strong>Live Clusters <span id="live-count">(0)</span></strong>
            <span>Right-click to assign to an ID</span>
          </div>
          <div id="cluster-tray" class="cluster-tray">
            <div class="tray-empty">Waiting for live clusters…</div>
          </div>
        </div>
      </section>

      <aside class="id-panel" aria-label="ID slots">
        <header class="id-panel-header">
          <div class="id-panel-brand">
            <a class="brand-mark" href="https://augmenta.tech" target="_blank" rel="noopener noreferrer" aria-label="Open Augmenta website">
              <img src="./augmenta-favicon.png?v=4" alt="">
            </a>
            <div>
              <h1>ID Management</h1>
              <span><b id="slot-count">12</b> slots</span>
            </div>
          </div>
          <div class="id-panel-status">
            <button id="warning-button" class="warning-button" type="button" hidden>0 warnings</button>
            <div class="connection-pill" title="Automatic Augmenta connection">
              <i aria-hidden="true"></i>
              <span id="connection-status">Connecting</span>
            </div>
          </div>
        </header>

        <div class="id-panel-actions">
          <button type="button" data-action="lock-all"><span class="lock-symbol closed" aria-hidden="true"></span>Lock all active</button>
          <button type="button" data-action="unlock-all"><span class="lock-symbol open" aria-hidden="true"></span>Unlock all active</button>
        </div>

        <div class="id-panel-help">
          <span>Click an ID number to enable/disable</span>
          <span><b>S</b> Solo</span>
        </div>

        <div id="id-list" class="id-list"></div>
      </aside>
    </div>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
